<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>學生保障服務平台｜獨立演示</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="student.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#/login" aria-label="學生保障服務平台首頁">
      <span class="brand-mark" aria-hidden="true">學</span>
      <span><strong>學生保障服務平台</strong><small>Student &amp; Family Demo</small></span>
    </a>
  </header>

  <div id="app-error" class="notice notice-danger" role="alert" hidden></div>
  <div id="app" aria-live="polite"></div>
  <div id="guide-pointer" class="guide-pointer" hidden aria-hidden="true"></div>
  <button id="guide-launcher" class="guide-launcher" type="button" data-action="reopen-guide" aria-expanded="false" aria-controls="student-guide" hidden>操作說明書 <span id="guide-launcher-step">第 1/7 步</span> · 展開</button>
  <aside id="student-guide" class="student-guide" role="dialog" aria-labelledby="student-guide-title" hidden>
    <header class="guide-titlebar" id="guide-titlebar">
      <div class="guide-title"><span class="eyebrow">ROLE-BASED WALKTHROUGH</span><h2 id="student-guide-title" tabindex="-1">操作說明書・跟隨步驟</h2></div>
      <div class="guide-window-controls">
        <button class="icon-button" type="button" data-action="close-guide" aria-label="最小化操作說明書" title="收起到右下角，保留目前步驟">−</button>
        <button class="icon-button" type="button" data-action="guide-maximize" aria-label="最大化操作說明書" title="最大化操作說明書" aria-pressed="false">□</button>
        <button class="icon-button" type="button" data-action="guide-reset-window" aria-label="恢復操作說明書預設尺寸與位置" title="恢復預設尺寸與位置，不改變步驟">↺</button>
      </div>
    </header>
    <div class="guide-controls">
      <label for="guide-step-select">操作步驟（可直接跳轉）</label>
      <select id="guide-step-select"></select>
      <p>桌面可拖動標題列與八向邊角調整；手機可全螢幕閱讀。收起後可從底部恢復，步驟與閱讀位置會保留。</p>
    </div>
    <div class="guide-content" id="guide-body">
      <p class="guide-role" id="guide-role"></p>
      <h3 id="guide-heading" tabindex="-1"></h3>
      <p id="guide-text"></p>
      <p class="guide-result"><strong>本步完成：</strong><span id="guide-done"></span></p>
      <p class="guide-principle">操作說明只帶你到功能位置，不會自動切換角色、不會填表或提交業務。</p>
    </div>
    <footer class="guide-footer">
      <p id="guide-location" role="status" aria-live="polite"></p>
      <span id="guide-progress" role="status" aria-live="polite"></span>
      <div class="guide-buttons">
        <button type="button" data-action="guide-previous">上一步</button>
        <button type="button" data-action="guide-next">下一步</button>
        <button type="button" class="button" data-action="guide-locate">帶我到這一步・箭頭提示</button>
      </div>
      <p>定位後可繼續閱讀原步驟；收起或按 Esc 會保留閱讀位置。閱讀本身不代表業務進度。</p>
    </footer>
    <span class="guide-resize" data-guide-resize="n" aria-hidden="true"></span>
    <span class="guide-resize" data-guide-resize="s" aria-hidden="true"></span>
    <span class="guide-resize" data-guide-resize="e" aria-hidden="true"></span>
    <span class="guide-resize" data-guide-resize="w" aria-hidden="true"></span>
    <span class="guide-resize" data-guide-resize="nw" aria-hidden="true"></span>
    <span class="guide-resize" data-guide-resize="ne" aria-hidden="true"></span>
    <span class="guide-resize" data-guide-resize="sw" aria-hidden="true"></span>
    <span class="guide-resize" data-guide-resize="se" aria-hidden="true"></span>
  </aside>
  <footer>
    <span>固定演示日期：2026-10-25</span>
    <span>學生基本醫保 ≠ 自願學平險 ≠ 學校責任險</span>
    <button class="text-button" type="button" data-action="reset">重置學生端演示資料</button>
  </footer>
</body>
</html>
